<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="auto" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="inframapArrowAws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="475" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#f8fafc">AWS Cloud Workloads &amp; Infrastructure</text>
  <text x="475" y="58" text-anchor="middle" font-size="13" fill="#94a3b8">Region: us-east-2 | Managed by GitHub Actions via OIDC</text>

  <rect x="30" y="80" width="890" height="425" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>
  <rect x="45" y="68" width="135" height="24" rx="6" fill="#f59e0b"/>
  <text x="112" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">AWS :: us-east-2</text>

  <!-- S3 Section -->
  <g transform="translate(60, 115)">
    <rect width="380" height="350" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(20, 20)">
      <rect width="36" height="36" rx="8" fill="#0284c7"/>
      <path d="M 18 10 L 28 15 L 18 20 L 8 15 Z M 8 18 L 18 23 L 28 18 M 8 22 L 18 27 L 28 22" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="48" y="24" font-size="15" font-weight="bold" fill="#f8fafc">Amazon S3</text>
    </g>

    <g transform="translate(20, 75)">
      <rect width="340" height="245" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="28" font-size="14" font-weight="bold" fill="#38bdf8">s3-aws-backups-prod-use2-001</text>
      <text x="16" y="48" font-size="11" font-family="monospace" fill="#94a3b8">aws_s3_bucket.backups</text>
      <line x1="16" y1="62" x2="324" y2="62" stroke="#334155" stroke-width="1"/>

      <g transform="translate(16, 75)">
        <rect width="308" height="36" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
        <text x="12" y="22" font-size="12" fill="#4ade80">🔒 Server-Side Encryption</text>
        <text x="210" y="22" font-size="11" font-family="monospace" fill="#86efac">AES256 (Default)</text>
      </g>
      <g transform="translate(16, 122)">
        <rect width="308" height="36" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
        <text x="12" y="22" font-size="12" fill="#38bdf8">🛡️ Public Access Block</text>
        <text x="210" y="22" font-size="11" font-family="monospace" fill="#7dd3fc">All Blocked</text>
      </g>
      <g transform="translate(16, 169)">
        <rect width="308" height="36" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
        <text x="12" y="22" font-size="12" fill="#c084fc">📦 Object Versioning</text>
        <text x="210" y="22" font-size="11" font-family="monospace" fill="#d8b4fe">Status: Enabled</text>
      </g>
      <text x="16" y="230" font-size="10" fill="#64748b" font-style="italic">Offsite Talos &amp; Cluster Backups</text>
    </g>
  </g>

  <!-- IAM Section -->
  <g transform="translate(480, 115)">
    <rect width="410" height="350" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(20, 20)">
      <rect width="36" height="36" rx="8" fill="#e11d48"/>
      <path d="M 18 10 C 14 10 11 13 11 17 C 11 20 13 22 16 23 L 16 28 L 20 28 L 20 25 L 22 25 L 22 23 C 25 22 27 20 27 17 C 27 13 24 10 18 10 Z" stroke="#ffffff" stroke-width="1.8" fill="none"/>
      <text x="48" y="24" font-size="15" font-weight="bold" fill="#f8fafc">AWS Identity &amp; Access (IAM)</text>
    </g>

    <g transform="translate(20, 75)">
      <rect width="370" height="95" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="16" y="26" font-size="13" font-weight="bold" fill="#fb7185">role-aws-eks-connector-prod-admin</text>
      <text x="16" y="46" font-size="11" font-family="monospace" fill="#94a3b8">aws_iam_role.eks_connector</text>
      <rect x="16" y="58" width="220" height="24" rx="4" fill="#0f172a"/>
      <text x="24" y="74" font-size="11" fill="#fca5a5">AssumeRole: ssm.amazonaws.com</text>
    </g>

    <g transform="translate(200, 172)">
      <path d="M 0 0 L 0 38" stroke="#38bdf8" stroke-width="2" marker-end="url(#inframapArrowAws)"/>
      <rect x="8" y="10" width="130" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="24" font-size="10" font-weight="bold" fill="#38bdf8">policy attached</text>
    </g>

    <g transform="translate(20, 220)">
      <rect width="370" height="95" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="16" y="26" font-size="13" font-weight="bold" fill="#fb7185">policy-aws-eks-connector-agent-prod-001</text>
      <text x="16" y="46" font-size="11" font-family="monospace" fill="#94a3b8">aws_iam_policy.eks_connector_agent</text>
      <rect x="16" y="58" width="295" height="24" rx="4" fill="#0f172a"/>
      <text x="24" y="74" font-size="11" fill="#fca5a5">Actions: ssmmessages:*</text>
    </g>
  </g>
</svg>