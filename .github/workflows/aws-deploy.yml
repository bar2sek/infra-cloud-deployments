name: "AWS Cloud Deployments CI/CD"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/aws/**"
      - ".github/workflows/aws-deploy.yml"
      - ".github/actions/generate-diagram/**"
  push:
    branches:
      - main
    paths:
      - "terraform/aws/**"
      - ".github/workflows/aws-deploy.yml"
      - ".github/actions/generate-diagram/**"
  workflow_dispatch:

# Least privilege: OIDC token minting + read-only checkout. No job writes to
# the repository; diagrams are uploaded as workflow artifacts.
permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Validation & Speculative Plan (Runs on Pull Requests)
  # ----------------------------------------------------------------------------
  plan:
    name: "Terraform Plan (PR Validation)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS Credentials via OIDC Workload Identity Federation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          # Redact the account ID from logs: AWS error messages embed it in ARNs,
          # and this repository's Actions logs are public.
          mask-aws-account-id: true

      - name: Check Terraform Formatting
        run: terraform fmt -check

      # The state bucket name embeds the AWS account ID, so it is a masked secret
      # rather than a variable — `run:` commands are echoed verbatim into logs.
      - name: Initialize Terraform (S3 Remote Backend with Native S3 Lockfile)
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}"

      - name: Validate Terraform Manifests
        run: terraform validate

      - name: Generate Speculative Terraform Plan
        id: plan
        run: terraform plan -no-color

      - name: Generate Speculative Topology Diagram (workflow artifact)
        uses: ./.github/actions/generate-diagram
        with:
          working-directory: terraform/aws
          output-file: docs/architecture-aws.svg
          provider-name: "AWS"

  # ----------------------------------------------------------------------------
  # 2. Automated Apply (Runs on Merge to Main within 'production' Environment)
  # ----------------------------------------------------------------------------
  apply:
    name: "Terraform Apply (Production)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          # The wrapper echoes extra lines to stdout, which corrupts
          # $(terraform output -raw ...) in the Knowledge Base sync step.
          terraform_wrapper: false

      - name: Configure AWS Credentials via OIDC Workload Identity Federation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          # Redact the account ID from logs: AWS error messages embed it in ARNs,
          # and this repository's Actions logs are public.
          mask-aws-account-id: true

      # The state bucket name embeds the AWS account ID, so it is a masked secret
      # rather than a variable — `run:` commands are echoed verbatim into logs.
      - name: Initialize Terraform (S3 Remote Backend with Native S3 Lockfile)
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}"

      - name: Apply Infrastructure Changes
        run: terraform apply -auto-approve

      # Ingestion is a runtime operation, not a Terraform resource. Git is the
      # source of truth for the corpus: `sync --delete` mirrors kb-corpus/ exactly,
      # and the ingestion job is incremental (only changed files are re-embedded).
      - name: Sync Bedrock Knowledge Base Corpus & Ingest
        run: |
          set -euo pipefail
          BUCKET=$(terraform output -raw bedrock_docs_bucket_name)
          KB_ID=$(terraform output -raw bedrock_kb_id)
          DS_ID=$(terraform output -raw bedrock_kb_data_source_id)

          aws s3 sync kb-corpus/ "s3://${BUCKET}/" --delete --only-show-errors

          JOB_ID=$(aws bedrock-agent start-ingestion-job \
            --knowledge-base-id "$KB_ID" --data-source-id "$DS_ID" \
            --query ingestionJob.ingestionJobId --output text)
          echo "Ingestion job: ${JOB_ID}"

          for _ in $(seq 1 60); do
            STATUS=$(aws bedrock-agent get-ingestion-job \
              --knowledge-base-id "$KB_ID" --data-source-id "$DS_ID" --ingestion-job-id "$JOB_ID" \
              --query ingestionJob.status --output text)
            case "$STATUS" in
              COMPLETE)
                aws bedrock-agent get-ingestion-job \
                  --knowledge-base-id "$KB_ID" --data-source-id "$DS_ID" --ingestion-job-id "$JOB_ID" \
                  --query ingestionJob.statistics --output table
                exit 0 ;;
              FAILED|STOPPED)
                aws bedrock-agent get-ingestion-job \
                  --knowledge-base-id "$KB_ID" --data-source-id "$DS_ID" --ingestion-job-id "$JOB_ID" \
                  --query ingestionJob.failureReasons --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Ingestion did not finish within 10 minutes" >&2
          exit 1

      - name: Generate Topology Diagram (workflow artifact)
        uses: ./.github/actions/generate-diagram
        with:
          working-directory: terraform/aws
          output-file: docs/architecture-aws.svg
          provider-name: "AWS"
