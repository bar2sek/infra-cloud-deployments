name: "Generate Architecture Diagram"
description: "Renders a cloud topology diagram with Inframap + Graphviz and uploads it as a workflow artifact"

# Diagrams are published as a downloadable workflow artifact, never committed:
#   * `main` is protected; every change (including diagrams) goes through a PR.
#   * The calling apply job holds production cloud credentials, so it keeps
#     `contents: read` and cannot write to the repository.
# To refresh the committed docs/ diagrams, download the artifact from the run
# and include it in a normal pull request.

inputs:
  working-directory:
    description: "The directory containing the Terraform manifests (e.g. terraform/aws)"
    required: true
  output-file:
    description: "Target path for the generated SVG diagram (e.g. docs/architecture-aws.svg)"
    required: true
  provider-name:
    description: "Cloud provider name (e.g. AWS, Azure, Cloudflare)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install System Dependencies (Graphviz)
      shell: bash
      run: |
        if ! command -v dot &> /dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
        fi

    # Pinned version AND checksum: this binary executes inside jobs that hold
    # cloud credentials. The SHA-256 matches GitHub's own release asset digest.
    - name: Install Inframap Binary (checksum-verified)
      shell: bash
      env:
        INFRAMAP_VERSION: "v0.8.0"
        INFRAMAP_SHA256: "f1b5372c4a64393a7f67a21bed41a981eb4ca449480558dfd173717f41ffc213"
      run: |
        if ! command -v inframap &> /dev/null; then
          curl -fsSL -o /tmp/inframap.tar.gz \
            "https://github.com/cycloidio/inframap/releases/download/${INFRAMAP_VERSION}/inframap-linux-amd64.tar.gz"
          echo "${INFRAMAP_SHA256}  /tmp/inframap.tar.gz" | sha256sum -c -
          tar -xzf /tmp/inframap.tar.gz -C /tmp
          sudo install -m 0755 /tmp/inframap-linux-amd64 /usr/local/bin/inframap
        fi

    - name: Generate Topology Diagram via Inframap
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        PROVIDER_NAME: ${{ inputs.provider-name }}
      run: |
        mkdir -p "$(dirname "${OUTPUT_FILE}")"
        echo "Generating architecture diagram for ${PROVIDER_NAME} from ${WORKING_DIRECTORY}..."
        inframap generate "${WORKING_DIRECTORY}" --clean=true > /tmp/graph.dot || true

        if [ -s /tmp/graph.dot ]; then
          dot -Tsvg /tmp/graph.dot -o "${OUTPUT_FILE}"
          dot -Tpng -Gdpi=150 /tmp/graph.dot -o "${OUTPUT_FILE%.svg}.png"
          echo "Generated ${OUTPUT_FILE} and ${OUTPUT_FILE%.svg}.png"
        else
          echo "Warning: inframap produced empty output, skipping rendering."
        fi

    - name: Upload Diagrams as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: architecture-${{ inputs.provider-name }}
        path: |
          ${{ inputs.output-file }}
        if-no-files-found: warn
        retention-days: 30
