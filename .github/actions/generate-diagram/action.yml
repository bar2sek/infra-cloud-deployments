name: "Generate Architecture Diagram"
description: "Generates a cloud semantic topology diagram using Inframap and Graphviz"

inputs:
  working-directory:
    description: "The directory containing the Terraform manifests (e.g. terraform/aws)"
    required: true
  output-file:
    description: "Target path for the generated SVG diagram (e.g. docs/architecture-aws.svg)"
    required: true
  provider-name:
    description: "Cloud provider name (e.g. AWS, Azure, Cloudflare)"
    required: true
  commit-changes:
    description: "Whether to commit the updated diagram back to git (main branch only)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install System Dependencies (Graphviz)
      shell: bash
      run: |
        if ! command -v dot &> /dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
        fi

    - name: Install Inframap Binary
      shell: bash
      run: |
        if ! command -v inframap &> /dev/null; then
          curl -sL https://github.com/cycloidio/inframap/releases/download/v0.8.0/inframap-linux-amd64.tar.gz | tar -xz
          chmod +x inframap-linux-amd64
          sudo mv inframap-linux-amd64 /usr/local/bin/inframap
        fi

    - name: Generate Topology Diagram via Inframap
      shell: bash
      run: |
        mkdir -p "$(dirname "${{ inputs.output-file }}")"
        echo "Generating architecture diagram for ${{ inputs.provider-name }} from ${{ inputs.working-directory }}..."
        inframap generate "${{ inputs.working-directory }}" --clean=true > /tmp/graph.dot || true

        if [ -s /tmp/graph.dot ]; then
          dot -Tsvg /tmp/graph.dot -o "${{ inputs.output-file }}"
          png_file="${{ inputs.output-file }}"
          png_file="${png_file%.svg}.png"
          dot -Tpng -Gdpi=150 /tmp/graph.dot -o "$png_file"
          echo "Successfully generated ${{ inputs.output-file }} and $png_file"
        else
          echo "Warning: inframap produced empty output, skipping rendering."
        fi

    - name: Commit and Push Updated Architecture Diagrams
      if: inputs.commit-changes == 'true'
      shell: bash
      run: |
        git config --local user.email "bar2sek@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        png_file="${{ inputs.output-file }}"
        png_file="${png_file%.svg}.png"
        if git status --porcelain "${{ inputs.output-file }}" "$png_file" | grep -q "docs/"; then
          echo "Changes detected in diagrams, committing..."
          git add "${{ inputs.output-file }}" "$png_file"
          git commit -m "docs(architecture): update ${{ inputs.provider-name }} topology diagrams [skip ci]"
          git push
        else
          echo "No diagram changes detected."
        fi

